<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No signal · Charlie Wuytack</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/media/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c0b" media="(prefers-color-scheme: dark)">
<!-- shown by sw.js in place of any page that was never kept, so every link here is from the site root -->
<link rel="stylesheet" href="/assets/site.css">
<style>
  /* fallback for when site.css was not kept either. Unlayered site.css beats this layer,
     and it sets every property below, so none of this shows when site.css loads. */
  @layer fallback {
    :root { color-scheme: light dark; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #fbfbf9; color: #1a1a18; font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) { body { background: #0b0c0b; color: #ecebe6; } }
    a { color: inherit; }
    .wrap { padding-inline: 16px; }
    .site-header, .site-footer { display: flex; justify-content: space-between; gap: 16px; padding: 16px; font-size: 13px; }
    .site-footer { flex-wrap: wrap; align-items: baseline; }
    .site-nav { display: flex; gap: 16px; }
    .site-header a, .site-nav a { text-decoration: none; }
    .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 24px; border: 1px solid; border-radius: 999px; text-decoration: none; }
    .btn:not(.secondary) { background: #1a1a18; color: #fbfbf9; border-color: transparent; }
    @media (prefers-color-scheme: dark) { .btn:not(.secondary) { background: #ecebe6; color: #0b0c0b; } }
  }
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .err { flex: 1; padding-block: clamp(var(--space-8, 64px), 16vh, var(--space-10, 128px)) var(--space-8, 64px); }
  .err .lead { max-width: 44ch; margin: var(--space-4, 16px) 0 0; color: var(--fg-2); }
  .err .actions { display: flex; flex-wrap: wrap; gap: var(--space-3, 12px); margin-top: var(--space-6, 32px); }
  .site-footer { width: 100%; margin-top: 0; }
  /* one left edge: header, content and footer all sit on the header's gutter
     (site-wide, this belongs in site.css) */
  .err, .site-footer {
    max-width: none; margin-inline: 0;
    padding-left: max(var(--gutter, 16px), env(safe-area-inset-left, 0px));
    padding-right: max(var(--gutter, 16px), env(safe-area-inset-right, 0px));
  }
  /* a bigger hit area without moving the layout, as .site-nav a has */
  a.site-name { position: relative; }
  a.site-name::after { content: ""; position: absolute; inset: -12px -8px; }
  @media (prefers-reduced-motion: no-preference) {
    .err.stagger > * { animation-name: err-fade; }
    .err.stagger > h1 { animation: err-rise var(--spring-bouncy-dur) var(--spring-bouncy) backwards, err-fade var(--dur-slow) var(--ease-out) backwards; }
    @keyframes err-fade { from { opacity: 0; } }
    @keyframes err-rise { from { transform: translateY(16px); } }
  }
</style>
</head>
<body>
<header class="site-header">
  <a class="site-name" href="/">Charlie Wuytack</a>
  <nav class="site-nav" aria-label="Site">
    <a href="/work/">Work</a>
    <a href="https://github.com/Charliewytk">GitHub</a>
    <a href="mailto:charlie@wuytack.net">Contact</a>
  </nav>
</header>

<main class="err stagger">
  <h1 style="--i:0">No signal.</h1>
  <p class="lead" style="--i:1">This page wasn't kept for offline use.</p>
  <div class="actions" style="--i:2">
    <a class="btn" href="">Try again</a>
    <a class="btn secondary" href="/">Home</a>
    <a class="btn secondary" href="/tracks/">Tracks</a>
  </div>
</main>

<footer class="site-footer">
  <p class="site-legal">Research and engineering, not financial advice. Nothing here is trading live at a profit.</p>
  <nav class="site-nav" aria-label="Contact">
    <a href="mailto:charlie@wuytack.net">charlie@wuytack.net</a>
    <a href="https://github.com/Charliewytk">GitHub</a>
  </nav>
</footer>
<script>
  // the connection is back: open the page that was asked for
  addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
