<style>
  :root {
    --ground: #070807;
    --ink: #ece8df;
    --muted: #a19c90;
    --faint: #8d887c;
    --rule: rgba(236, 232, 223, 0.12);
    --glow: #3ddc84;
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  a { color: inherit; }
  ::selection { background: rgba(61, 220, 132, 0.3); }
  button { font: inherit; }

  /* top bar */
  .bar {
    position: fixed; inset: 0 0 auto 0; z-index: 60;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 28px; font-size: 12px; letter-spacing: 0.08em;
    pointer-events: none; color: var(--ink);
  }
  .bar > * { pointer-events: auto; }
  .bar .who { font-weight: 500; }
  .bar nav { display: flex; gap: 20px; }
  .bar a, .bar button { text-decoration: none; opacity: 0.78; background: none; border: 0; color: inherit; padding: 0; cursor: pointer; font-size: 12px; letter-spacing: 0.08em; }
  .bar a:hover, .bar button:hover, .bar a:focus-visible, .bar button:focus-visible { opacity: 1; }
  .bar :focus-visible { outline: 1px solid var(--glow); outline-offset: 4px; }

  /* stage */
  .hero { position: fixed; inset: 0; overflow: hidden; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: none; touch-action: none; }
  .hero::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 46%, rgba(0,0,0,0.6) 100%);
  }

  /* keyboard access: one button per object, visible only on focus */
  .keys { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 20; display: flex; gap: 8px; }
  .keys button {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
    background: none; color: var(--ink); border: 0; padding: 4px 2px; font: italic 500 18px var(--serif); cursor: pointer;
    text-shadow: 0 0 14px rgba(0,0,0,0.9);
  }
  .keys button:focus-visible { position: static; width: auto; height: auto; clip: auto; outline: none; text-decoration: underline; text-decoration-color: var(--glow); text-underline-offset: 6px; }

  /* fallback (no WebGL) */
  .fallback { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; z-index: 1; padding: 0 16px; }
  .no-webgl .fallback { display: flex; }
  .no-webgl #scene { display: none; }
  .fallback .shelf2d {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; align-items: flex-end; padding: 0 24px 14px; max-width: 900px;
    border-bottom: 14px solid #6b4426; box-shadow: 0 18px 40px rgba(0,0,0,0.5);
  }
  .fallback button { background: none; border: 1px solid var(--rule); color: var(--ink); cursor: pointer; padding: 10px 14px; font-size: 13px; border-radius: 4px; }
  .fallback button:hover { border-color: var(--glow); }

  /* hover label */
  .tip {
    position: fixed; z-index: 25; pointer-events: none; opacity: 0; white-space: nowrap; text-align: center; margin-top: 34px;
    font-family: var(--serif); font-style: italic; font-size: 19px; line-height: 1.1; color: var(--ink); letter-spacing: 0.01em;
    text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 0 18px rgba(0,0,0,0.85);
    transform: translate(-50%, -100%) translateY(6px); transition: opacity 0.35s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .tip small { display: block; margin-top: 4px; font: 500 10px var(--mono); font-style: normal; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .tip.on { opacity: 1; transform: translate(-50%, -100%); }

  /* work index */
  .index {
    position: fixed; inset: 0; z-index: 50; background: rgba(7,8,7,0.97); overflow-y: auto;
    padding: 90px 28px 60px; opacity: 0; pointer-events: none; transition: opacity 0.35s;
  }
  .index.open { opacity: 1; pointer-events: auto; }
  .index .inner { max-width: 1000px; margin: 0 auto; }
  .index h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 0 0 18px; line-height: 1; }
  .index h2 em { color: var(--muted); }
  .index ul { list-style: none; margin: 0; padding: 0; }
  .index li { }
  .index li button {
    all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
    display: grid; grid-template-columns: 44px 1fr auto; gap: 18px; align-items: baseline; padding: 18px 4px;
    transition: padding 0.3s ease, background 0.3s;
  }
  .index li button:hover, .index li button:focus-visible { padding-left: 14px; color: #fff; }
  .index li button:hover .t, .index li button:focus-visible .t { font-style: italic; }
  .index li button:focus-visible { outline: none; }
  .index li button:focus-visible .n { color: var(--glow); }
  .index .n { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .index .t { font-family: var(--serif); font-size: clamp(1.4rem, 3vw, 2rem); line-height: 1.1; }
  .index .d { display: block; font-family: var(--sans); font-size: 14px; color: var(--muted); margin-top: 3px; }
  .index .tag { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
  .index small { display: block; margin-top: 40px; color: var(--faint); font-size: 12px; }
  .x {
    position: fixed; top: 54px; right: 28px; z-index: 61; background: none; border: 0; color: var(--ink); padding: 4px 0;
    font: italic 500 20px var(--serif); cursor: pointer; opacity: 0; transition: opacity 0.4s, color 0.2s; white-space: nowrap;
    text-shadow: 0 0 16px rgba(0,0,0,0.9);
  }
  .x small { font: 500 10px var(--mono); font-style: normal; letter-spacing: 0.16em; color: var(--muted); margin-left: 10px; vertical-align: 3px; }
  .x:hover { color: var(--glow); }
  .open > .x, .index .x { opacity: 1; }
  .x:focus-visible { outline: none; color: var(--glow); }

  /* ================= project world ================= */
  /* opened by the camera flying into an object's face: clip-path and transform are driven per frame from JS */
  .world {
    position: fixed; inset: 0; z-index: 45; overflow-y: auto; overflow-x: hidden;
    background: #060706; color: var(--ink);
    opacity: 0; pointer-events: none; visibility: hidden;
  }
  .world.live { visibility: visible; }
  /* the page scrolls under the name and nav: fade it out up there instead of drawing a bar */
  .world::before { content: ""; position: sticky; top: 0; display: block; height: 110px; margin-bottom: -110px; z-index: 4; pointer-events: none; background: linear-gradient(#060706 30%, rgba(6,7,6,0)); }
  .world.fade { transition: opacity 0.45s ease; }
  .world.open { opacity: 1; pointer-events: auto; }
  #w-inner { transform-origin: 50vw 50vh; will-change: transform; }
  .w-hero { position: relative; height: 100vh; min-height: 560px; overflow: hidden; }
  .w-hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; background:
      radial-gradient(ellipse at 30% 100%, rgba(6,7,6,0.85) 0%, rgba(6,7,6,0) 60%),
      linear-gradient(180deg, rgba(6,7,6,0.55) 0%, rgba(6,7,6,0) 22%, rgba(6,7,6,0) 60%, rgba(6,7,6,0.9) 100%); }
  .w-bg { position: absolute; inset: 0; }
  .w-bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .w-kick { position: absolute; z-index: 3; left: 28px; top: 62px; margin: 0; font: 500 12px var(--mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--acc); }
  .w-title {
    position: absolute; z-index: 3; left: -0.05em; bottom: -0.16em; margin: 0; white-space: nowrap;
    font-family: var(--serif); font-weight: 500; font-size: clamp(7rem, 24vw, 30rem); line-height: 0.8; letter-spacing: -0.045em;
    color: var(--ink); will-change: transform;
    transform: translateY(30%); opacity: 0; transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.05s, opacity 0.6s ease 0.05s;
  }
  .world.open .w-title { transform: translateY(0); opacity: 1; }
  .w-num { position: absolute; z-index: 3; right: 28px; top: 11vh; text-shadow: 0 0 24px #000, 0 0 60px #000, 0 0 90px #000; text-align: right; max-width: 60vw;
    transform: translateY(-20px); opacity: 0; transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s, opacity 0.6s ease 0.2s; }
  .world.open .w-num { transform: none; opacity: 1; }
  .w-num b { display: block; font-family: var(--serif); font-weight: 500; font-size: clamp(4.5rem, 13vw, 14rem); line-height: 0.85; letter-spacing: -0.04em; color: var(--acc); }
  .w-num b s { opacity: 0.45; }
  .w-num span { display: block; margin-top: 22px; font: 500 12px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .w-more { position: relative; max-width: 1180px; margin: 0 auto; padding: 90px 28px 80px; }
  .w-line { font-family: var(--serif); font-style: italic; font-size: clamp(1.8rem, 4.4vw, 3.6rem); line-height: 1.08; margin: 0; max-width: 20ch; }
  .w-media { margin: 70px -28px 0; height: 78vh; overflow: hidden; position: relative; -webkit-mask-image: linear-gradient(180deg, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(180deg, transparent, #000 14%, #000 86%, transparent); }
  .w-media img { position: absolute; left: 0; top: -15%; width: 100%; height: 130%; object-fit: cover; will-change: transform; }
  .w-media.phones { display: flex; justify-content: center; gap: 4vw; align-items: center; background: radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--acc) 18%, transparent), transparent 60%); }
  .w-media.phones img { position: static; width: auto; height: 82%; object-fit: contain; border-radius: 28px; box-shadow: 0 40px 80px -30px rgba(0,0,0,0.8); }
  .w-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 28px 48px; margin: 80px 0 0; }
  .w-stat { padding: 0; }
  .w-stat b { display: block; font-family: var(--serif); font-weight: 500; font-size: clamp(2.6rem, 6vw, 4.6rem); line-height: 0.95; letter-spacing: -0.02em; }
  .w-stat b s { opacity: 0.5; }
  .w-stat span { display: block; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .w-body { columns: 2 300px; column-gap: 40px; margin: 56px 0 0; font-size: 17px; line-height: 1.65; color: #cfcabd; }
  .w-body p { margin: 0 0 14px; break-inside: avoid; }
  .w-body strong { color: var(--acc); font-weight: 500; }
  .w-foot { margin: 100px 0 0; padding-top: 0; display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .w-foot a { text-decoration: none; border-bottom: 1px solid var(--acc); color: var(--ink); }

  /* background: the project's own screen, full bleed (static image, CSS scanlines) */
  .crt { position: absolute; inset: 0; overflow: hidden; background: #000; }
  .crt img { position: absolute; inset: -4%; width: 108%; height: 108%; object-fit: cover; filter: saturate(0.9) contrast(1.12) brightness(0.78); }
  .crt::before { content: ""; position: absolute; inset: 0; z-index: 1; background: repeating-linear-gradient(180deg, rgba(0,0,0,0.34) 0 1px, transparent 1px 3px); }
  .crt::after { content: ""; position: absolute; inset: 0; z-index: 2; background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0,0,0,0.85) 100%); }

  /* background: ExeTix phones fanning */
  .fan { position: absolute; inset: 0; }
  .fan img { position: absolute; right: 12vw; bottom: 8vh; height: 70vh; border-radius: 34px; box-shadow: 0 50px 90px -30px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.06);
    transform-origin: 50% 120%; transform: translateX(var(--x)) rotate(var(--r)); transition: transform 1.3s cubic-bezier(0.16, 1, 0.3, 1); }
  .fan img:nth-child(1) { --r: -22deg; --x: -12vw; }
  .fan img:nth-child(2) { --r: 0deg; --x: 0vw; z-index: 2; }
  .fan img:nth-child(3) { --r: 22deg; --x: 12vw; }
  .world:not(.open) .fan img:not(:nth-child(2)) { transform: translateX(0) rotate(0); }

  /* background: chess board */
  .board-wrap { position: absolute; inset: 0; perspective: 1100px; display: grid; place-items: center; }
  .board { width: min(86vh, 90vw); aspect-ratio: 1; display: grid; grid-template-columns: repeat(8, 1fr); position: relative;
    transform: translate(18vw, -6vh) rotateX(58deg) rotateZ(-24deg); transform-style: preserve-3d;
    box-shadow: 0 0 0 10px #15130f, 0 80px 120px rgba(0,0,0,0.8); }
  .board i { display: block; background: #1b1915; }
  .board i.l { background: #2c2922; }
  .board .pc { position: absolute; width: 12.5%; height: 12.5%; display: grid; place-items: center; font-size: min(7vh, 7vw); color: var(--acc);
    transform: rotateZ(24deg) rotateX(-58deg) translateY(-30%); transition: left 0.9s cubic-bezier(0.65,0,0.35,1), top 0.9s cubic-bezier(0.65,0,0.35,1); text-shadow: 0 8px 18px rgba(0,0,0,0.8); }
  .board .pc.b { color: #6f6a5e; }

  /* film grain: one small noise tile, nudged a few times a second */
  .grain { position: fixed; inset: -50%; z-index: 70; pointer-events: none; opacity: 0.07; mix-blend-mode: overlay; background-size: 220px 220px; animation: grain 0.9s steps(5) infinite; }
  @keyframes grain { 0% { transform: translate(0, 0); } 20% { transform: translate(-3%, 2%); } 40% { transform: translate(2%, -3%); } 60% { transform: translate(-2%, -1%); } 80% { transform: translate(3%, 3%); } 100% { transform: translate(0, 0); } }

  @media (max-width: 720px) {
    .bar { padding: 14px 16px; }
    .bar nav { gap: 14px; }
    .index { padding: 76px 16px 40px; }
    .index li button { grid-template-columns: 30px 1fr; }
    .index .tag { display: none; }
    .x { top: 46px; right: 16px; }
    .w-kick { left: 16px; top: 100px; }
    .w-num { right: 16px; top: 15vh; }
    .w-title { font-size: 30vw; }
    .w-more { padding: 60px 16px 60px; }
    .w-media { margin: 50px -16px 0; height: 60vh; }
    .fan img { height: 48vh; right: 50%; margin-right: -14vh; bottom: 20vh; }
    .board { transform: translate(6vw, -10vh) rotateX(58deg) rotateZ(-24deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .world.fade, .w-title, .w-num, .index, .index li button, .fan img { transition: none; }
    .grain { animation: none; }
    .tip, .tip.on { transition: opacity 0.2s; transform: translate(-50%, -100%); }
  }
  .static-list { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; }
  .static-list ul { list-style: none; margin: 0; padding: 0; text-align: center; font-family: var(--serif); font-size: 1.6rem; line-height: 1.6; }
  .static-list a { color: inherit; text-decoration: none; }
  .w-link { margin: 28px 0 0; font-family: var(--serif); font-style: italic; font-size: 1.35rem; }
  .w-link a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 2px; }
  .w-link a:hover, .w-link a:focus-visible { color: var(--acc, #3ddc84); outline: none; }
</style>

<script>
(() => {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ================= content ================= */
  const P = {
    "exetix": { n: "01", t: "ExeTix", tag: "Built and sold", d: "Pinged the second Exeter tickets drop.", acc: "#3ddc84", kind: "fan",
      line: "Exeter tickets sell out in seconds. This got students there first.",
      big: ["1–2 s", "ticket drop to lock screen"],
      stats: [["1–2 s", "from ticket drop to lock screen"], ["0%", "fees for sellers"], ["Sold", "built, shipped, then sold in Oct 2026"]],
      body: `<p>An iOS app for Exeter student tickets. Alerts reach the lock screen about <strong>1–2 seconds</strong> after a drop.</p><p>Sold out anyway? Buy a verified student's spare. Sellers pay no fees. On the App Store from 29 September 2026. <strong>Built it, then sold it.</strong></p>`,
      imgs: ["exetix/img/store-01-welcome.webp", "exetix/img/screen-drops.webp", "exetix/img/screen-alerts.webp"], phones: true },
    "kill-log": { n: "02", t: "The Kill Log", tag: "Research", d: "Research that says no.", acc: "#e0533d", kind: "crt",
      line: "Most trading ideas die. This is where they die on the record.",
      big: ["50", "trading ideas killed out of sample"],
      stats: [["50", "trading ideas killed out of sample"], ["~170", "hypotheses SHA-256 sealed before results"], ["p ≈ 1.0", "deflated Sharpe of the best of 3,038 trials"]],
      body: `<p>Every idea gets a pre-registered hurdle, sealed with <strong>SHA-256</strong> before any result is seen. Then it runs out of sample.</p><p>The best of 3,038 trials has a deflated Sharpe of <strong>p ≈ 1.0</strong>. That is the honest answer, and it is published.</p>`,
      imgs: ["media/og-kill-log.png"] },

          if (med > quality.display * 1.5 && quality.step < 2) setQuality(quality.step + 1);

      }
    }

  function placeCyl(m, a, b) {

})();
