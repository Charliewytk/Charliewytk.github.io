<!doctype html>
<!-- Generated by build.py from ../_content/content.json. Edit template.html or build.py, then run: python3 concepts/notes/build.py -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{NAME}}</title>
<meta name="description" content="Charlie Wuytack builds apps, Mac tools, games and honest quant research. Built and sold ExeTix, an iPhone app for Exeter's ticket drops.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/media/favicon.svg" type="image/svg+xml">
<script>document.documentElement.classList.add('js')</script>
<link rel="stylesheet" href="style.css">
<style>
{{FOLDER_CSS}}
</style>
<script src="app.js" defer></script>
</head>
<body>

<!-- Icons, drawn once. 24px grid, 1.75 stroke, like SF Symbols at regular weight. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.6l2 2h7.4A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></symbol>
  <symbol id="i-chev-l" viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chev-r" viewBox="0 0 12 20"><path d="m3 4 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-clear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m8.5 8.5 7 7m0-7-7 7" stroke="var(--clear-x)" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3h7l5 5v11.5A1.5 1.5 0 0 1 17.5 21h-10A1.5 1.5 0 0 1 6 19.5v-15A1.5 1.5 0 0 1 7.5 3z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/><path d="M14 3v5h5M9 13h6M9 16.5h6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7.5 5h3v14h-3zM13.5 5h3v14h-3z" fill="currentColor"/></symbol>
</svg>

<div class="app" id="app">

  <!-- Pane 1: folders (a sidebar on desktop, the first screen of the stack on phone) -->
  <nav class="screen folders" id="folders" aria-labelledby="folders-title">
    <header class="bar"><span class="bar-title" aria-hidden="true">Folders</span></header>
    <p class="large" id="folders-title">Folders</p>
    <div class="frows-wrap">
      <div class="pill fpill" id="fpill" aria-hidden="true"></div>
      <ul class="group frows">
{{FOLDERS}}
      </ul>
    </div>
  </nav>
  <div class="scrim" aria-hidden="true"></div>

  <!-- Pane 2: the note list -->
  <section class="screen list" id="list" aria-labelledby="list-title">
    <header class="bar">
      <a class="back" href="#folders" data-back><svg aria-hidden="true"><use href="#i-chev-l"/></svg><span>Folders</span></a>
      <span class="bar-title" aria-hidden="true">{{NAME}}</span>
    </header>
    <h1 class="large" id="list-title">{{NAME}}</h1>
    <div class="search" role="search">
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Search" aria-label="Search notes" aria-keyshortcuts="Meta+K Control+K" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button class="clear" type="button" aria-label="Clear search" hidden><svg aria-hidden="true"><use href="#i-clear"/></svg></button>
    </div>
    <div class="rows-wrap">
      <div class="pill" id="pill" aria-hidden="true"></div>
      <ul class="group rows" id="rows">
{{ROWS}}
      </ul>
      <p class="empty" id="empty" hidden>No Results</p>
    </div>
    <footer class="owner owner-list">
      <ul class="group">
{{OWNER_LINKS}}
      </ul>
      <p>{{FOOTER}}</p>
    </footer>
  </section>
  <div class="scrim" aria-hidden="true"></div>

  <!-- Pane 3: the open note. Every note is in the HTML; CSS shows one. -->
  <main class="screen note" id="note">
    <header class="bar">
      <a class="back" href="#" data-back><svg aria-hidden="true"><use href="#i-chev-l"/></svg><span id="back-label">{{NAME}}</span></a>
    </header>
    <div class="sentinel" aria-hidden="true"></div>
{{NOTES}}
  </main>

  <!-- Desktop only: sits under the folders, but comes last so Tab reaches search and notes first. -->
  <footer class="owner owner-side">
    <ul>
{{OWNER_LINKS}}
    </ul>
    <p>{{FOOTER}}</p>
  </footer>

</div>
</body>
</html>
