<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Abyss Warden — an original deep-sea tower defence. Hold the trench. Keep the lights on.">
<title>Abyss Warden</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b3d57">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='42' fill='%23052436'/%3E%3Ccircle cx='50' cy='55' r='42' fill='none' stroke='%237df3ff' stroke-width='5'/%3E%3Ccircle cx='50' cy='42' r='12' fill='%23aef4ff'/%3E%3Cpath d='M30 72 Q50 58 70 72' stroke='%23ffd873' stroke-width='6' fill='none'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0; height: 100%; background: #010912; overflow: hidden;
    overscroll-behavior: none;          /* no rubber-band drag on iOS */
    touch-action: none;                 /* no double-tap zoom / pan */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;        /* no long-press share sheet */
    -webkit-tap-highlight-color: transparent;
  }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; cursor: none; }
  @media (pointer: coarse) { canvas { cursor: default; } }
  /* measures env() safe-area insets so JS can keep the play field clear of
     notches and the home indicator; zero-sized and non-interactive */
  #safe-probe {
    position: fixed; top: 0; left: 0; width: 0; height: 0;
    pointer-events: none; visibility: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
</style>
</head>
<body>
<div id="safe-probe"></div>
<div id="wrap"><canvas id="game"></canvas></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
